<ion-header>
  <ion-toolbar>
    <ion-title>Pasajero</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="auth.logout()">Cerrar sesión</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Hola, {{ user?.name }}</h2>
  <p>Sesión iniciada como pasajero. Aquí irá el mapa para pedir tu viaje.</p>
</ion-content>
