<ion-content class="ion-padding">
  <main class="wrap">
    <h1>Restablecer contraseña</h1>
    <p class="sub">Escribe tu correo y la contraseña nueva.</p>

    <ion-item lines="full"><ion-input label="Correo" labelPlacement="floating" type="email" [(ngModel)]="email"></ion-input></ion-item>
    <ion-item lines="full"><ion-input label="Contraseña nueva" labelPlacement="floating" type="password" [(ngModel)]="newPassword" (keyup.enter)="submit()"></ion-input></ion-item>

    <ion-button expand="block" color="primary" size="large" (click)="submit()" [disabled]="loading || !email || !newPassword">
      @if (loading) { <ion-spinner name="dots"></ion-spinner> } @else { Cambiar contraseña }
    </ion-button>

    <nav class="links"><a routerLink="/login">Volver a iniciar sesión</a></nav>
  </main>
</ion-content>
